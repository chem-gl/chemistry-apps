# frontend/nginx.conf: Publica frontend compilado y enruta /api al backend Django.
#
# Estrategia de caché (causa raíz del "la app muere tras cada deploy"):
# index.html se servía sin Cache-Control, el navegador lo cacheaba de forma
# heurística y tras el deploy seguía pidiendo bundles viejos (main-XXXX.js,
# chunk-YYYY.js) que ya no existen; el fallback SPA los resolvía con index.html
# (200 text/html) y el navegador abortaba con "Expected a JavaScript-or-Wasm
# module script but the server responded with a MIME type of text/html".
# Reglas: index.html NUNCA se cachea; assets hasheados se cachean 1 año y, si
# faltan, responden 404 (error claro) en lugar del HTML del SPA.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html (petición directa y destino del fallback SPA de abajo):
    # nunca cacheable. `always` aplica las cabeceras también a 304 y errores.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Bundles con hash de contenido en el nombre: inmutables por construcción
    # (cada deploy genera nombres nuevos). `try_files $uri =404` garantiza que
    # un bundle inexistente dé 404 y NUNCA index.html; sin `always`, el 404 no
    # arrastra el Cache-Control largo y no se cachea durante un año.
    location ~ ^/(?:main|chunk|polyfills|runtime)-[^/]+\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/styles-[^/]+\.css$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Recursos no hasheados bajo /assets/ (logos, i18n, imágenes): caché
    # moderada de 7 días; si falta el fichero, 404 en vez de index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # Resto de rutas: comportamiento SPA actual (fallback a index.html). La
    # caché del fallback queda regida por el bloque `= /index.html` de arriba,
    # porque try_files re-ejecuta el matching de locations con la URI final.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
