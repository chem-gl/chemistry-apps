<!-- app-illustration.component.html: Lienzo SVG para la ilustración de la app. -->
<svg
  class="app-illustration"
  viewBox="0 0 48 48"
  fill="none"
  stroke="currentColor"
  stroke-width="2.5"
  stroke-linecap="round"
  stroke-linejoin="round"
  role="img"
  aria-hidden="true"
  [attr.width]="size()"
  [attr.height]="size()"
  [innerHTML]="svgContent()"
></svg>
