<!-- job-progress-card.component.html: Bloque de progreso estandarizado (plano: vive dentro del result-panel). -->
<div class="progress-card" aria-live="polite">
  @if (jobId !== null && jobId !== '') {
  <p class="job-id">{{ jobId }}</p>
  }
  <progress class="progress-track" [attr.aria-label]="progressAriaLabel"
    [title]="'shared.jobProgress.progressTitle' | transloco" [value]="progressPercentage" max="100">
    <div class="progress-fill" [style.width.%]="progressPercentage"></div>
  </progress>
  <p class="progress-pct">{{ progressPercentage }}%</p>
  <p class="progress-message">{{ progressMessage }}</p>
</div>
