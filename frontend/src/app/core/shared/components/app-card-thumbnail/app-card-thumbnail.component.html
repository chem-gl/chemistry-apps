<!-- app-card-thumbnail.component.html: Captura real, icono circular o ilustración de la app. -->
<figure class="card-thumbnail">
  @if (showScreenshot()) {
  <img
    class="card-thumbnail-img"
    [src]="appItem().thumbnailScreenshot"
    [alt]="'scientificApps.' + appItem().key + '.title' | transloco"
    width="480"
    height="300"
    sizes="(min-width: 30rem) 300px, 92vw"
    loading="lazy"
    decoding="async"
    (error)="onScreenshotError()"
  />
  } @else if (showIcon()) {
  <img
    class="card-icon-img"
    [src]="appItem().iconAsset"
    [alt]="'scientificApps.' + appItem().key + '.title' | transloco"
    width="80"
    height="80"
    sizes="80px"
    loading="lazy"
    decoding="async"
    (error)="onIconError()"
  />
  } @else {
  <app-app-illustration class="card-thumbnail-fallback" [appKey]="appItem().key" [size]="72" />
  }
</figure>
