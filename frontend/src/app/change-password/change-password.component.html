<!-- change-password.component.html: Formulario de cambio obligatorio de contraseña. -->
<section class="change-password-shell" [attr.aria-label]="'changePassword.title' | transloco">
  <div class="change-password-panel">
    <p class="change-password-eyebrow">{{ 'changePassword.eyebrow' | transloco }}</p>
    <h2 class="change-password-title">{{ 'changePassword.title' | transloco }}</h2>
    <p class="change-password-copy">{{ 'changePassword.copy' | transloco }}</p>

    <form class="change-password-form" (ngSubmit)="submit()">
      <label>
        <span class="field-label-text">{{ 'changePassword.current' | transloco }}</span>
        <input [ngModel]="currentPassword()" (ngModelChange)="currentPassword.set($event)" name="currentPassword"
          type="password" autocomplete="current-password" required />
      </label>

      <label>
        <span class="field-label-text">{{ 'changePassword.new' | transloco }}</span>
        <input [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" name="newPassword"
          type="password" autocomplete="new-password" required minlength="8" />
      </label>

      <label>
        <span class="field-label-text">{{ 'changePassword.confirm' | transloco }}</span>
        <input [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" name="confirmPassword"
          type="password" autocomplete="new-password" required minlength="8" />
      </label>

      @if (localErrorMessage(); as errorMessage) {
      <p class="error-message" role="alert">{{ errorMessage }}</p>
      }

      <button class="submit-button" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? ('changePassword.submitting' | transloco) : ('changePassword.submit' | transloco) }}
      </button>
    </form>
  </div>
</section>
