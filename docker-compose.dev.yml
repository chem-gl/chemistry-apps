# docker-compose.dev.yml: Único uso de Docker permitido en desarrollo: Redis.
#
# Docker solo se usa para producción (docker-compose.yml legacy retirado,
# docker-compose.libres.yml producción actual). Desarrollo es nativo:
# backend con poetry, frontend con npm (ver README §10).
# Si acaso, este archivo levanta solo Redis como broker local para Celery/Channels.

services:
  redis:
    image: redis:7-alpine
    hostname: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - ./.docker/dev/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      app_dev_net:
        aliases:
          - redis

networks:
  app_dev_net:
    driver: bridge
