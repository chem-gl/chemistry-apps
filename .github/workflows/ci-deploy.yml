name: CI / CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
      # Este workflow solo valida (tests y build); el despliegue de
      # producción lo hace `deploy-libres.yml`, que espera la conclusión
      # exitosa del run de este workflow sobre el mismo commit.
  workflow_dispatch: {}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Detect affected services
        id: filter
        uses: dorny/paths-filter@v4
        # Sin `base:`: por defecto compara before→after en push y base→head
        # en PR. Fijar `base: ${{ github.ref }}` compararía la rama consigo
        # misma (diff vacío) y omitiría TODO, incluidos deploys de main.
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'scripts/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              # `frontend/**` no surel ficheros que empiezan con punto según la
              # config de micromatch del action; se explicita el .dockerignore
              # porque cambia el contenido del `COPY . .` de la imagen del front.
              - 'frontend/.dockerignore'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
            # NOTA: solo-docs (README*) no disparan builds; en main igual se
            # crea el release y el deploy resulta no-op (tags previos).

  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    # Gate de lo que se publica: la suite corre en cada push a main, cada push
    # a dev y cada PR hacia main. En main no se cancela a media corrida: un run
    # cancelado dejaría el commit sin validar y bloquearía su despliegue
    # (`deploy-libres.yml` espera la conclusión del run de este commit).
    concurrency:
      group: ci-tests-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    # El resto del frontend se valida en el job `frontend` (npm ci + build +
    # `ng test`); los catálogos i18n se validan aparte en el job `i18n`, porque la
    # imagen compila aunque el JSON esté roto (son assets estáticos).
    needs: [changes]
    if: |
      needs.changes.outputs.backend == 'true' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) ||
        github.event_name == 'pull_request'
      )

    env:
      # Fuente única de la versión de Python del job. Un anchor YAML (`&x`) no
      # se puede interpolar dentro de `${{ ... }}`, así que la comparten
      # `setup-python` y la clave del caché vía `env` (actionlint exige que todo
      # anchor definido se use; sin esto quedaba muerto en el archivo).
      PYTHON_VERSION: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/poetry.lock

      - name: Cache Poetry venv
        # setup-python `cache: pip` no cachea venvs de poetry; sin esto cada
        # run reinstala torch/rdkit/etc (~85s). Key por poetry.lock.
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry config virtualenvs.in-project true
          poetry env use python
          poetry install --with dev --no-interaction --no-ansi

      - name: Run backend tests with coverage gate
        working-directory: backend
        env:
          # Sin broker/worker: la suite no encola jobs reales en Celery.
          JOB_DISPATCH_ENABLED: "0"
        # `manage.py test` no instrumenta nada: el `fail_under = 91` de
        # backend/pyproject.toml ([tool.coverage.report]) solo se aplica cuando
        # `coverage` envuelve la suite (antes, en CI, nunca se aplicaba). Con
        # `coverage run` + `coverage report`, un total por debajo del umbral
        # sale con código != 0 y tumba el job — igual que en local con
        # `scripts/generate_sonar_coverage.sh`. `--source=.` y los `omit`
        # (migraciones, management/commands, libs/, .venv/, manage.py, config/)
        # se resuelven desde `backend/`, el mismo layout del runner.
        run: |
          poetry run coverage run --source=. manage.py test
          poetry run coverage report

  i18n:
    name: i18n catalogs
    runs-on: ubuntu-latest
    # Regresión real (2026-11-08): escrituras concurrentes dejaron `de.json` y
    # `ru.json` con JSON inválido. Transloco no puede cargar el catálogo, la app
    # cae a inglés con error de consola y NADA en CI lo detectaba: la imagen
    # Docker del frontend compila igual (los JSON son assets estáticos) y no había
    # job de `ng test` en este workflow. Gate barato: parsear los 8 catálogos y
    # exigir el mismo conjunto de claves hoja que `en.json`.
    # La paridad de placeholders (`{{name}}` compacto) y el recuento base los
    # cubre `frontend/src/app/core/i18n/i18n-catalog-parity.spec.ts` en
    # `npx ng test --watch=false` (job `frontend`, local y
    # `scripts/generate_sonar_coverage.sh`).
    needs: [changes]
    if: |
      needs.changes.outputs.frontend == 'true' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) ||
        github.event_name == 'pull_request'
      )
    concurrency:
      group: ci-i18n-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate catalogs (JSON válido + paridad con en.json)
        env:
          I18N_DIR: frontend/public/i18n
        # `python3` viene instalado en ubuntu-latest; no se toca npm ni el
        # `package-lock.json`, así que el paso cuesta ~2 s. Herencia de claves
        # (dict anidado + arrays indexados) igual que el spec de paridad.
        run: |
          python3 - "$I18N_DIR" <<'PY'
          import json
          import pathlib
          import sys

          CATALOG_DIR = pathlib.Path(sys.argv[1])
          # Los idiomas se descubren leyendo el directorio (evita una lista
          # hardcodeada que se desincroniza al añadir un catálogo). El conjunto
          # esperado lo valida `i18n-catalog-parity.spec.ts` contra
          # SUPPORTED_LANGUAGE_CODES; aquí basta JSON válido + paridad de claves.
          LANGUAGES = sorted(path.stem for path in CATALOG_DIR.glob("*.json"))
          if not LANGUAGES:
              print(f"::error:: no hay catálogos i18n en {CATALOG_DIR}")
              sys.exit(1)

          def leaf_paths(node, prefix=""):
              """Rutas de las hojas string del catálogo (`a.b[0].c`)."""
              if isinstance(node, str):
                  return {prefix} if prefix else set()
              if isinstance(node, list):
                  found = set()
                  for index, item in enumerate(node):
                      found |= leaf_paths(item, f"{prefix}[{index}]")
                  return found
              if isinstance(node, dict):
                  found = set()
                  for key, value in node.items():
                      found |= leaf_paths(value, f"{prefix}.{key}" if prefix else key)
                  return found
              return set()

          problems = []
          catalogs = {}
          for language in LANGUAGES:
              path = CATALOG_DIR / f"{language}.json"
              if not path.is_file():
                  problems.append(f"{language}.json: archivo ausente en {CATALOG_DIR}")
                  continue
              try:
                  catalogs[language] = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as error:
                  problems.append(
                      f"{language}.json: JSON inválido en línea {error.lineno} "
                      f"columna {error.colno} ({error.msg})"
                  )

          if problems or "en" not in catalogs:
              for problem in problems:
                  print(f"::error:: {problem}")
              sys.exit(1)

          reference = leaf_paths(catalogs["en"])
          print(f"en.json: {len(reference)} claves hoja (referencia).")

          for language in LANGUAGES:
              if language == "en" or language not in catalogs:
                  continue
              keys = leaf_paths(catalogs[language])
              missing = sorted(reference - keys)
              extra = sorted(keys - reference)
              if not missing and not extra:
                  print(f"{language}.json: OK ({len(keys)} claves).")
                  continue
              if missing:
                  print(f"::error:: {language}.json pierde {len(missing)} claves de en.json.")
                  for key in missing[:20]:
                      print(f"  - {key}")
              if extra:
                  print(f"::error:: {language}.json declara {len(extra)} claves ajenas a en.json.")
                  for key in extra[:20]:
                      print(f"  + {key}")
              sys.exit(1)
          PY

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    # Regresión estructural: la suite del frontend (1190 tests en 92 archivos)
    # corría SOLO en local y en `scripts/generate_sonar_coverage.sh`. En CI no
    # había job de `ng test`: `build.yml` se limita a compilar la imagen Docker
    # (que ejecuta `ng build` dentro del `frontend/Dockerfile`) y `i18n` valida
    # los catálogos JSON. Un commit que rompiese un componente, un template o el
    # tipado de un servicio llegaba a producción con el gate en verde. Este job es
    # el equivalente frontend de `tests`: compila y ejecuta la suite antes de
    # que `build` empaquete imagen o release. Sin cobertura ni lcov a propósito:
    # el gate de cobertura del frontend no existe en CI (los reportes de Sonar los
    # genera el script local, no el pipeline).
    # Ojo con el nombre: `build.yml` (workflow reutilizable) tiene SU propio job
    # `frontend`, que compila la imagen Docker. No colisionan: los jobs de un
    # workflow llamado no se exponen al caller. Aquí `frontend` = suite de tests.
    needs: [changes]
    if: |
      needs.changes.outputs.frontend == 'true' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) ||
        github.event_name == 'pull_request'
      )
    # Mismo criterio que `tests` e `i18n`: en main no se cancela a media corrida
    # (un run cancelado deja el commit sin validar y bloquea su despliegue).
    concurrency:
      group: ci-frontend-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

    env:
      # Fuente única de la versión de Node del job. Debe seguir el stage `build`
      # de `frontend/Dockerfile` (`FROM node:22-alpine AS build`): `@angular/*` 21
      # pide `^20.19 || ^22.12`, `@axe-core/playwright` y `commander` piden
      # `>=22.12`, y `lighthouse@13` exige `>=22.19`. Con node 20 el `npm ci` del
      # runner soltaba `npm warn EBADENGINE`. `cache: npm` usa el hash del lockfile
      # real, no esta variable, así que cambiarla no invalida el caché.
      NODE_VERSION: "22"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        # `npm ci` (no `npm install`): respeta `package-lock.json` al pie de la
        # letra, igual que el stage `build` del Dockerfile; así el job valida el
        # árbol exacto que se empaquetará.
        run: npm ci

      - name: Compilar la aplicación (ng build)
        working-directory: frontend
        # Primero el build: si un template o el tipado de un componente rompen la
        # compilación, el fallo se ve aquí (rápido y con la ruta del archivo) en
        # vez de hundido en la salida de vitest. `npm run build` = `ng build`, el
        # mismo comando del Dockerfile, y aplica los `budgets` de producción
        # (initial <= 1MB) que `ng test` no comprueba. Duplica el `ng build` que
        # corre dentro de la imagen en `build.yml`: cuesta ~10 s y ahí se ve el
        # error de frente, además de que esa imagen no ejecuta ni un test.
        run: npm run build

      - name: Ejecutar suite unitaria (ng test)
        working-directory: frontend
        # Builder `@angular/build:unit-test` (angular.json) sobre vitest con
        # entorno jsdom: no necesita navegador real ni `CHROME_BIN` en el runner.
        # `--watch=false` para que termine (exit != 0 si algún test falla).
        run: npx ng test --watch=false

  build:
    name: Build reusable workflow
    # Corre en dev, main y PRs. Exige tests en `success` siempre que el cambio
    # toca backend: un `skipped` de tests solo se acepta cuando NO toca backend
    # (solo frontend/docs). Así el build y el release quedan imposibles si la
    # suite falla, se cancela o ni siquiera se ejecutó sobre código backend.
    # Mismo criterio con `i18n` y `frontend` cuando el cambio toca frontend: ni un
    # catálogo JSON inválido ni la suite de `ng test` sin correr se empaquetan en
    # imagen ni en release.
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.tests.result == 'success' ||
        (needs.tests.result == 'skipped' && needs.changes.outputs.backend != 'true')
      ) &&
      (
        needs.i18n.result == 'success' ||
        (needs.i18n.result == 'skipped' && needs.changes.outputs.frontend != 'true')
      ) &&
      (
        needs.frontend.result == 'success' ||
        (needs.frontend.result == 'skipped' && needs.changes.outputs.frontend != 'true')
      ) &&
      (
        github.event_name == 'pull_request' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/dev'
      )
    needs: [changes, tests, i18n, frontend]
    permissions:
      contents: write
      # El workflow llamado (build.yml) pide `actions: write` para el caché
      # de capas Docker: el caller debe otorgarlo o el run muere en arranque.
      actions: write
    # Cancela builds obsoletos ante un nuevo push: si un commit queda anulado en
    # main, su run de CI / CD termina `cancelled` y el gate de
    # `deploy-libres.yml` se niega a desplegarlo (solo se publica el commit cuyo
    # CI llegó a término). El despliegue en sí es un workflow aparte, sin
    # `cancel-in-progress`, y nunca se interrumpe a la mitad.
    concurrency:
      group: ci-build-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    with:
      create_release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      rebuild_backend: ${{ needs.changes.outputs.backend == 'true' }}
      rebuild_frontend: ${{ needs.changes.outputs.frontend == 'true' }}
    secrets: inherit

  # El job `deploy` (stack antiguo apps.guzman-lopez.com /
  # back-apps.guzman-lopez.com, `docker-compose.yml`) y su workflow reutilizable
  # `.github/workflows/deploy.yml` se eliminaron el 2026-11-08. Ambos estaban
  # retirados desde el 2026-09-25 (`if: false`): el código muerto solo confundía.
  # La producción es https://apps.agalano.com y la despliega
  # `.github/workflows/deploy-libres.yml`, que se apoya en el job `ci-check` de
  # este workflow como punto único de verdad. El historial de GitHub conserva los
  # runs antiguos de "Reusable Deploy".

  ci-check:
    name: CI checks
    # Punto único de verdad del pipeline: `deploy-libres.yml` consulta la
    # conclusión del run de este workflow, así que cualquier job omitido por
    # error tiene que fallar aquí.
    if: always()
    needs: [changes, tests, i18n, frontend, build]
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      TESTS_RESULT: ${{ needs.tests.result }}
      I18N_RESULT: ${{ needs.i18n.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
      FRONTEND_CHANGED: ${{ needs.changes.outputs.frontend }}
    steps:
      - name: All applicable checks passed
        run: |
          fail=0
          [ "$CHANGES_RESULT" = "success" ] || { echo "ERROR: detección de cambios falló ($CHANGES_RESULT)."; fail=1; }

          # Mismo criterio que el job Build: tests son obligatorios cuando el
          # cambio toca backend; `skipped` solo se acepta si NO toca backend.
          if [ "$TESTS_RESULT" = "success" ]; then
            echo "Backend validado por la suite."
          elif [ "$TESTS_RESULT" = "skipped" ] && [ "$BACKEND_CHANGED" != "true" ]; then
            echo "Tests omitidos: el cambio no toca backend."
          else
            echo "ERROR: backend sin validar (tests=$TESTS_RESULT, changes.backend=$BACKEND_CHANGED)."; fail=1
          fi

          # Mismo criterio para los catálogos i18n: obligatorios si toca frontend.
          if [ "$I18N_RESULT" = "success" ]; then
            echo "Catálogos i18n validados."
          elif [ "$I18N_RESULT" = "skipped" ] && [ "$FRONTEND_CHANGED" != "true" ]; then
            echo "Validación i18n omitida: el cambio no toca frontend."
          else
            echo "ERROR: i18n sin validar (i18n=$I18N_RESULT, changes.frontend=$FRONTEND_CHANGED)."; fail=1
          fi

          # Mismo criterio para la suite del frontend: obligatoria si toca frontend
          # (build + `ng test`). Sin esto el job quedaba fuera del punto único de
          # verdad y `deploy-libres.yml` desplegaba con frontend sin validar.
          if [ "$FRONTEND_RESULT" = "success" ]; then
            echo "Frontend validado por ng test."
          elif [ "$FRONTEND_RESULT" = "skipped" ] && [ "$FRONTEND_CHANGED" != "true" ]; then
            echo "Suite del frontend omitida: el cambio no toca frontend."
          else
            echo "ERROR: frontend sin validar (frontend=$FRONTEND_RESULT, changes.frontend=$FRONTEND_CHANGED)."; fail=1
          fi

          [ "$BUILD_RESULT" = "success" ] || { echo "ERROR: build falló ($BUILD_RESULT)."; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "CI completado; los jobs no afectados fueron omitidos."
