name: CI / CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - dev
  workflow_dispatch: {}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Detect affected services
        id: filter
        uses: dorny/paths-filter@v4
        # Sin `base:`: por defecto compara before→after en push y base→head
        # en PR. Fijar `base: ${{ github.ref }}` compararía la rama consigo
        # misma (diff vacío) y omitiría TODO, incluidos deploys de main.
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'scripts/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'docker-compose*.yml'
              - '.github/workflows/**'
            # NOTA: solo-docs (README*) no disparan builds; en main igual se
            # crea el release y el deploy resulta no-op (tags previos).

  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    # Cancela tests obsoletos si llega otro push a dev. NUNCA toca main:
    # en main/PRs este job ni siquiera existe (if) y el deploy no participa.
    concurrency:
      group: ci-tests-${{ github.ref }}
      cancel-in-progress: true
    # Los tests solo corren en push a dev; en main y PRs ya debieron pasar en dev.
    # El frontend se valida compilando su imagen Docker en el job Build
    # (evita `npm ci` + `npm run build` duplicados).
    needs: [changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: &python_version "3.12"
          cache: pip
          cache-dependency-path: backend/poetry.lock

      - name: Cache Poetry venv
        # setup-python `cache: pip` no cachea venvs de poetry; sin esto cada
        # run reinstala torch/rdkit/etc (~85s). Key por poetry.lock.
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-venv-${{ runner.os }}-3.12-${{ hashFiles('backend/poetry.lock') }}

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry
          poetry config virtualenvs.in-project true
          poetry env use python
          poetry install --with dev --no-interaction --no-ansi

      - name: Run backend tests
        working-directory: backend
        env:
          JOB_DISPATCH_ENABLED: "0"
        run: poetry run python manage.py test

  build:
    name: Build reusable workflow
    # Corre en dev, main y PRs; acepta tests skipped (solo corren en dev).
    if: |
      always() &&
      (needs.tests.result == 'success' || needs.tests.result == 'skipped') &&
      needs.changes.result == 'success' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: [changes, tests]
    permissions:
      contents: write
      # El workflow llamado (build.yml) pide `actions: write` para el caché
      # de capas Docker: el caller debe otorgarlo o el run muere en arranque.
      actions: write
    # Cancela builds obsoletos ante un nuevo push (el deploy, job aparte
    # sin concurrency, jamás se interrumpe una vez en curso).
    concurrency:
      group: ci-build-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    with:
      create_release: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      rebuild_backend: ${{ needs.changes.outputs.backend == 'true' }}
      rebuild_frontend: ${{ needs.changes.outputs.frontend == 'true' }}
    secrets: inherit

  deploy:
    name: Deploy reusable workflow
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    needs: [build, changes]
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
      rebuild_backend: ${{ needs.changes.outputs.backend == 'true' }}
      rebuild_frontend: ${{ needs.changes.outputs.frontend == 'true' }}
    secrets: inherit

  ci-check:
    name: CI checks
    if: always()
    needs: [changes, tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: All applicable checks passed
        run: |
          fail=0
          [ "${{ needs.changes.result }}" = "success" ] || { echo "ERROR: detección de cambios falló."; fail=1; }
          if [ "${{ needs.tests.result }}" != "success" ] && [ "${{ needs.tests.result }}" != "skipped" ]; then
            echo "ERROR: tests fallaron (${{ needs.tests.result }})."; fail=1
          fi
          [ "${{ needs.build.result }}" = "success" ] || { echo "ERROR: build falló (${{ needs.build.result }})."; fail=1; }
          [ "$fail" -eq 0 ] || exit 1
          echo "CI completado; los jobs no afectados fueron omitidos."
