# .github/workflows/deploy-libres.yml
#
# Despliegue de PRODUCCIÓN: https://apps.agalano.com, servido por el stack
# Docker Compose aislado (`docker-compose.libres.yml` en
# `/home/deploy/chemistry-apps-libres`). El modo libre es un interruptor
# (`OPEN_MODE_ENABLED`): hoy está CERRADO por `vars.LIBRES_OPEN_MODE_ENABLED=0`
# desde 2026-09-26, así que el sitio sirve catálogo público en solo lectura.
# El default es 0 también en `docker-compose.libres.yml` y en el `.env` que se
# genera aquí: sin la variable del repo el sitio no queda abierto (fail-closed).
#
# Autónomo a propósito: no comparte pasos ni vars con `ci-deploy.yml`. El
# antiguo workflow reutilizable `deploy.yml` (asociado al stack retirado el
# 2026-09-25) se eliminó del repo el 2026-11-08; este archivo nunca lo usó.
# Construye el bundle con `git archive` del commit que se empuja y despliega en
# su propio directorio.
#
# Triggers: push a `main` publica producción; también puede lanzarse a mano
# con workflow_dispatch.
#
# GATE DE CI: `push` a main dispara en paralelo "CI / CD" (`ci-deploy.yml`) y
# este despliegue. El primer paso ("Wait for CI on this commit") bloquea hasta
# que el run de CI / CD sobre EL MISMO commit termine en `success`; si falla,
# se cancela o no aparece en el plazo límite, aborta sin tocar el host. No se
# usa `needs:` porque los workflows de distintos trigger no pueden encadenarse
# sin `workflow_run`, y eso reordenaría los runs: consultar la API de Actions
# mantiene ambos workflows desacoplados y aun así es imposible desplegar un
# main roto.
#
# `workflow_dispatch` acepta el input booleano `skip_ci_wait` (default false):
# OMITE el gate y despliega el commit tal cual. Solo para emergencias (p. ej.
# runner de CI caído con un hotfix ya validado a mano); deja un warning
# visible en el log del run.

name: Deploy production apps.agalano.com

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'memos/**'
      - 'docs/**'
      - 'research/**'
      - '.github/instructions/**'
      # Stack retirado (apps.guzman-lopez.com): tocarlo no debe desplegar
      # producción. El stack vivo es `docker-compose.libres.yml`.
      - 'docker-compose.yml'
  workflow_dispatch:
    inputs:
      skip_ci_wait:
        description: 'EMERGENCIA: despliega sin esperar el gate de CI / CD del commit'
        type: boolean
        default: false

# Un despliegue a la vez sobre el mismo stack; nunca se interrumpe a la mitad.
concurrency:
  group: apps-libres-deploy
  cancel-in-progress: false

# `actions: read` = consultar los runs de CI / CD del commit (gate).
# `contents: read` = checkout + `git archive` del bundle. Nada más se escribe.
permissions:
  contents: read
  actions: read

env:
  LIBRES_COMPOSE_FILE: docker-compose.libres.yml
  LIBRES_ENV_FILE: .env.deploy
  LIBRES_BUNDLE_FILE: apps-libres-bundle.tar.gz
  LIBRES_STAGING_DIR: /tmp/apps-libres-deploy-${{ github.run_id }}-${{ github.run_attempt }}
  # Guarda de disco: el host tiene ~41 GB libres e imágenes de 10-17 GB.
  LIBRES_MIN_FREE_GB: "15"
  # Gate de CI: workflow a vigilar (por ruta; el nombre "CI / CD" coincide con
  # `gh api repos/<repo>/actions/workflows --jq '.workflows[]|{name,path}'`) y
  # plazo máximo. Los runs de CI / CD duran 2-6 min con cachés tibios; 1800 s
  # cubre un build Docker de backend en runner frío sin bloquear el deploy.
  LIBRES_CI_WORKFLOW_FILE: ci-deploy.yml
  LIBRES_CI_WAIT_TIMEOUT_SECONDS: "1800"
  LIBRES_CI_WAIT_POLL_SECONDS: "20"

jobs:
  deploy:
    name: Deploy open mode site
    runs-on: ubuntu-latest
    steps:
      # GATE DE CI (ver comentario del trigger): primer paso, falla antes de
      # leer secrets, construir el bundle o tocar el host.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.sha }}
          CI_WORKFLOW_FILE: ${{ env.LIBRES_CI_WORKFLOW_FILE }}
          CI_TIMEOUT_SECONDS: ${{ env.LIBRES_CI_WAIT_TIMEOUT_SECONDS }}
          CI_POLL_SECONDS: ${{ env.LIBRES_CI_WAIT_POLL_SECONDS }}
          SKIP_CI_WAIT: ${{ inputs.skip_ci_wait }}
        run: |
          set -uo pipefail

          if [ "${SKIP_CI_WAIT:-}" = "true" ]; then
            echo "::warning::skip_ci_wait=true: se omite el gate de CI / CD (despliegue de emergencia)."
            exit 0
          fi

          SHA="${CI_HEAD_SHA:?commit sin SHA: no se puede validar su CI}"
          QUERY="repos/${GITHUB_REPOSITORY}/actions/workflows/${CI_WORKFLOW_FILE}/runs?head_sha=${SHA}&per_page=100"
          # Una sola línea: status|conclusion|html_url del run automático más
          # nuevo de este commit. `sort_by(.run_id)` escoge el re-intento más
          # reciente; los runs lanzados a mano (workflow_dispatch) no certifican
          # este push, así que solo cuentan push y pull_request. Si no hay runs,
          # la expresión devuelve "pending".
          JQ_PROG='[.workflow_runs[]
            | select(.event == "push" or .event == "pull_request")]
            | sort_by(.run_id)
            | map([.status, (.conclusion // "-"), .html_url] | join("|"))
            | .[-1] // "pending|-|-"'
          deadline=$(( $(date +%s) + CI_TIMEOUT_SECONDS ))

          echo "Esperando el run de CI / CD (${CI_WORKFLOW_FILE}) de ${SHA}."
          echo "Timeout: ${CI_TIMEOUT_SECONDS}s | Sondeo: cada ${CI_POLL_SECONDS}s"

          while :; do
            # `gh api` sale con código != 0 ante errores HTTP por sí solo; NO
            # usar `--exit-status` (ese flag no existe en todas las versiones
            # del CLI y rompería el paso con "unknown flag").
            if ! row="$(timeout 30 gh api --jq "$JQ_PROG" "$QUERY" 2>&1)"; then
              if printf '%s' "$row" | grep -qiE 'HTTP 404|Not Found'; then
                echo "::error::No se encontró el workflow ${CI_WORKFLOW_FILE} en ${GITHUB_REPOSITORY}: el gate no puede validarse."
                exit 1
              fi
              echo "AVISO: API de Actions no disponible ($(printf '%s' "$row" | tr '\n' ' ' | tr -d '\r')); reintentando."
              row=""
            fi

            if printf '%s' "$row" | grep -q '|'; then
              status="${row%%|*}"
              rest="${row#*|}"
              conclusion="${rest%%|*}"
              url="${rest#*|}"
              echo "  status=${status} conclusion=${conclusion} ${url}"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "Gate OK: CI / CD pasó en ${SHA}; se puede desplegar."
                  exit 0
                fi
                # failure, cancelled, timed_out, action_required, stale: nada
                # de esto es código verificado, así que no se publica.
                echo "::error::CI / CD terminó con '${conclusion}' en ${SHA}; el despliegue se aborta. ${url}"
                exit 1
              fi
            else
              echo "  (sin run de CI / CD terminado para este commit; esperando)"
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI / CD no completó en ${CI_TIMEOUT_SECONDS}s para ${SHA}; el despliegue se aborta."
              exit 1
            fi
            sleep "${CI_POLL_SECONDS}"
          done

      - name: Validate required config (vars + secrets)
        env:
          _PROJECT_PATH: ${{ vars.LIBRES_VM_PROJECT_PATH }}
          _ALLOWED_HOSTS: ${{ vars.LIBRES_ALLOWED_HOSTS }}
          _BACKEND_PUBLIC_URL: ${{ vars.LIBRES_BACKEND_PUBLIC_URL }}
          _DB_NAME: ${{ vars.LIBRES_DB_NAME }}
          _DB_USER: ${{ vars.LIBRES_DB_USER }}
          _DB_PASSWORD: ${{ secrets.LIBRES_DB_PASSWORD }}
          _SECRET_KEY: ${{ secrets.LIBRES_SECRET_KEY }}
          _QTA_SSH_KEY: ${{ secrets.QTA_SSH_PRIVATE_KEY }}
        run: |
          missing=()
          [ -z "$_PROJECT_PATH" ] && missing+=(vars.LIBRES_VM_PROJECT_PATH)
          [ -z "$_ALLOWED_HOSTS" ] && missing+=(vars.LIBRES_ALLOWED_HOSTS)
          [ -z "$_BACKEND_PUBLIC_URL" ] && missing+=(vars.LIBRES_BACKEND_PUBLIC_URL)
          [ -z "$_DB_NAME" ] && missing+=(vars.LIBRES_DB_NAME)
          [ -z "$_DB_USER" ] && missing+=(vars.LIBRES_DB_USER)
          [ -z "$_DB_PASSWORD" ] && missing+=(secrets.LIBRES_DB_PASSWORD)
          [ -z "$_SECRET_KEY" ] && missing+=(secrets.LIBRES_SECRET_KEY)
          [ -z "$_QTA_SSH_KEY" ] && missing+=(secrets.QTA_SSH_PRIVATE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: faltan vars/secrets del sitio libre: ${missing[*]}"
            exit 1
          fi
          echo "Configuración del sitio libre completa."

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build .env file for deployment
        env:
          SECRET_KEY: ${{ secrets.LIBRES_SECRET_KEY }}
          DB_NAME: ${{ vars.LIBRES_DB_NAME }}
          DB_USER: ${{ vars.LIBRES_DB_USER }}
          DB_PASSWORD: ${{ secrets.LIBRES_DB_PASSWORD }}
          ALLOWED_HOSTS: ${{ vars.LIBRES_ALLOWED_HOSTS }}
          BACKEND_PUBLIC_URL: ${{ vars.LIBRES_BACKEND_PUBLIC_URL }}
          PUBLIC_DISPATCH_RATE: ${{ vars.LIBRES_PUBLIC_DISPATCH_RATE }}
          PUBLIC_READ_RATE: ${{ vars.LIBRES_PUBLIC_READ_RATE }}
          ANONYMOUS_JOB_TTL_HOURS: ${{ vars.LIBRES_ANONYMOUS_JOB_TTL_HOURS }}
          SHARED_CACHE_TTL_DAYS: ${{ vars.LIBRES_SHARED_CACHE_TTL_DAYS }}
          ANONYMOUS_MAX_CONCURRENT_JOBS: ${{ vars.LIBRES_ANONYMOUS_MAX_CONCURRENT_JOBS }}
          OPEN_MODE_ENABLED: ${{ vars.LIBRES_OPEN_MODE_ENABLED }}
          GOOGLE_CLIENT_ID: ${{ vars.LIBRES_GOOGLE_CLIENT_ID }}
          # Vacío = el worker usa el default de docker-compose.libres.yml
          # (known_hosts persistente en /app/media/runtime-tools).
          QTA_SSH_KNOWN_HOSTS_PATH: ${{ vars.LIBRES_QTA_SSH_KNOWN_HOSTS_PATH }}
          BACKEND_INTERNAL_PORT: ${{ vars.LIBRES_EXTERNAL_BACKEND_PORT }}
          FRONTEND_INTERNAL_PORT: ${{ vars.LIBRES_EXTERNAL_FRONTEND_PORT }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > "$LIBRES_ENV_FILE" <<EOF_ENV
          DEBUG=0
          SECRET_KEY=${SECRET_KEY}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_HOST=db
          DB_PORT=5432
          POSTGRES_DB=${DB_NAME}
          POSTGRES_USER=${DB_USER}
          POSTGRES_PASSWORD=${DB_PASSWORD}
          DJANGO_ALLOWED_HOSTS=${ALLOWED_HOSTS}
          ALLOWED_HOSTS=${ALLOWED_HOSTS}
          NUM_PROXIES=1
          CORS_ALLOWED_ORIGINS=${BACKEND_PUBLIC_URL}
          CSRF_TRUSTED_ORIGINS=${BACKEND_PUBLIC_URL}
          BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL}
          BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT:-8090}
          FRONTEND_INTERNAL_PORT=${FRONTEND_INTERNAL_PORT:-4220}
          PUBLIC_DISPATCH_RATE=${PUBLIC_DISPATCH_RATE:-60/hour}
          # 600/h: coincide con el default de settings.py. Los 120/h antiguos
          # agotaban la cuota en aulas y redes NAT (varias personas comparten
          # la misma IP).
          PUBLIC_READ_RATE=${PUBLIC_READ_RATE:-600/hour}
          ANONYMOUS_JOB_TTL_HOURS=${ANONYMOUS_JOB_TTL_HOURS:-24}
          SHARED_CACHE_TTL_DAYS=${SHARED_CACHE_TTL_DAYS:-7}
          ANONYMOUS_MAX_CONCURRENT_JOBS=${ANONYMOUS_MAX_CONCURRENT_JOBS:-2}
          # Fail-closed: si la variable del repo falta, el modo libre queda
          # CERRADO (es el estado intencional desde 2026-09-26).
          OPEN_MODE_ENABLED=${OPEN_MODE_ENABLED:-0}
          # Vacío = login con Google deshabilitado (ver /api/auth/providers/).
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
          CELERY_HEAVY_PLUGINS=toxicity-properties
          CELERY_HEAVY_QUEUE=heavy
          # Server Calc: archivo known_hosts para Host Key Checking dentro de los
          # workers Celery. Vacío = default del compose (ruta persistente en
          # /app/media/runtime-tools); HOME=/app no tiene /app/.ssh escribible.
          QTA_SSH_KNOWN_HOSTS_PATH=${QTA_SSH_KNOWN_HOSTS_PATH:-}
          DEFAULT_REGISTRATION_GROUP_SLUG=abierto
          IMAGE_TAG=${IMAGE_TAG}
          IMAGE_TAG_BACKEND=${IMAGE_TAG}
          IMAGE_TAG_FRONTEND=${IMAGE_TAG}
          IMAGE_REGISTRY=ghcr.io
          IMAGE_NAMESPACE=${{ github.repository_owner }}
          EOF_ENV
          echo "Archivo de entorno generado para el commit ${IMAGE_TAG}."

      - name: Build deployment bundle
        run: |
          git archive --format=tar.gz --output "$LIBRES_BUNDLE_FILE" "${GITHUB_SHA}"
          ls -lh "$LIBRES_BUNDLE_FILE"

      - name: Preflight SSH connectivity
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_PORT: ${{ vars.VM_PORT }}
        run: |
          for attempt in 1 2 3; do
            if timeout 10 bash -lc "cat < /dev/null > /dev/tcp/${VM_HOST}/${VM_PORT}" 2>/dev/null; then
              echo "Conectividad TCP OK contra ${VM_HOST}:${VM_PORT}"
              exit 0
            fi
            echo "Intento ${attempt}/3 sin conectividad a ${VM_HOST}:${VM_PORT}."
            sleep 5
          done
          echo "ERROR: no hay conectividad TCP hacia ${VM_HOST}:${VM_PORT}."
          exit 1

      - name: Prepare SSH private key
        id: ssh_key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KEY_BASE64: ${{ secrets.VM_SSH_KEY_BASE64 }}
          VM_SSH_PASSPHRASE: ${{ secrets.VM_SSH_PASSPHRASE }}
        run: |
          set -e
          KEY_DIR="$GITHUB_WORKSPACE/.github/.tmp-ssh"
          KEY_FILE="$KEY_DIR/deploy_key"
          mkdir -p "$KEY_DIR"

          if [ -n "${VM_SSH_KEY_BASE64:-}" ]; then
            printf '%s' "$VM_SSH_KEY_BASE64" | base64 -d > "$KEY_FILE"
          else
            printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > "$KEY_FILE"
          fi

          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -P "${VM_SSH_PASSPHRASE:-}" -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "ERROR: VM_SSH_KEY no es válida o requiere passphrase incorrecta."
            exit 1
          fi

          echo "key_path=$KEY_FILE" >> "$GITHUB_OUTPUT"
          {
            echo "private_key<<__DEPLOY_KEY__"
            cat "$KEY_FILE"
            echo "__DEPLOY_KEY__"
          } >> "$GITHUB_OUTPUT"

      - name: Upload bundle to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          port: ${{ vars.VM_PORT }}
          key: ${{ steps.ssh_key.outputs.private_key }}
          passphrase: ${{ secrets.VM_SSH_PASSPHRASE }}
          source: "${{ env.LIBRES_ENV_FILE }},${{ env.LIBRES_BUNDLE_FILE }}"
          target: ${{ env.LIBRES_STAGING_DIR }}
          overwrite: true
          timeout: 120s
          command_timeout: 20m

      - name: Deploy on remote host
        uses: appleboy/ssh-action@v1.2.2
        env:
          PROJECT_PATH: ${{ vars.LIBRES_VM_PROJECT_PATH }}
          COMPOSE_FILE: ${{ env.LIBRES_COMPOSE_FILE }}
          ENV_FILE: ${{ env.LIBRES_ENV_FILE }}
          BUNDLE_FILE: ${{ env.LIBRES_BUNDLE_FILE }}
          STAGING_DIR: ${{ env.LIBRES_STAGING_DIR }}
          MIN_FREE_GB: ${{ env.LIBRES_MIN_FREE_GB }}
          QTA_SSH_PRIVATE_KEY: ${{ secrets.QTA_SSH_PRIVATE_KEY }}
          # Los runtime tools (JREs + JAR Ambit) ya existen en el stack
          # principal: se copian para no descargarlos de nuevo en cada volumen.
          RUNTIME_TOOLS_SOURCE: /home/deploy/chemistry-apps/backend/media/runtime-tools
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          port: ${{ vars.VM_PORT }}
          key: ${{ steps.ssh_key.outputs.private_key }}
          passphrase: ${{ secrets.VM_SSH_PASSPHRASE }}
          envs: PROJECT_PATH,COMPOSE_FILE,ENV_FILE,BUNDLE_FILE,STAGING_DIR,MIN_FREE_GB,RUNTIME_TOOLS_SOURCE,QTA_SSH_PRIVATE_KEY
          command_timeout: 60m
          script: |
            set -e

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "ERROR: docker compose no está disponible en el host."
              exit 1
            fi

            mkdir -p "$PROJECT_PATH" "$STAGING_DIR"
            CURRENT_UID="$(id -u)"
            CURRENT_GID="$(id -g)"

            # Reparar propietarios de código fuente (excluye datos persistentes).
            docker run --rm -v "$PROJECT_PATH:/work" alpine \
              sh -c "find /work -maxdepth 1 -mindepth 1 ! -name docker-data -exec chown -R ${CURRENT_UID}:${CURRENT_GID} {} + 2>/dev/null; true"

            tar --no-same-owner -xzf "$STAGING_DIR/$BUNDLE_FILE" -C "$PROJECT_PATH"

            mkdir -p "$PROJECT_PATH/docker-data/postgres" "$PROJECT_PATH/docker-data/redis" "$PROJECT_PATH/backend/media"
            chmod u+rwX "$PROJECT_PATH/backend/media" 2>/dev/null || true
            chmod u+rwX "$PROJECT_PATH/docker-data/redis" 2>/dev/null || true

            cd "$PROJECT_PATH"

            if [ -f .env ] && cmp -s "$STAGING_DIR/$ENV_FILE" .env; then
              echo ".env sin cambios; se conserva."
            else
              install -m 600 "$STAGING_DIR/$ENV_FILE" .env
            fi

            export HOST_UID="$(id -u)"
            export HOST_GID="$(id -g)"

            # Liberar espacio antes del build: el host comparte disco con el
            # stack principal y las imágenes del backend pesan 10-17 GB.
            docker image prune -a -f
            docker builder prune -f

            FREE_GB="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
            echo "Espacio libre antes del build: ${FREE_GB} GB (mínimo ${MIN_FREE_GB} GB)."
            if [ "${FREE_GB:-0}" -lt "$MIN_FREE_GB" ]; then
              echo "ERROR: espacio insuficiente para construir el stack del modo abierto."
              echo "Libera disco (docker image prune -a -f) o detén el stack principal."
              exit 1
            fi

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env build --no-cache --pull backend frontend

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env up -d --wait db redis

            # Los runtime tools científicos (JREs + JAR Ambit) son obligatorios
            # para que Django arranque: se copian del stack principal si existen
            # y, si falta algo, `ensure_runtime_tools` los descarga.
            if [ -d "$RUNTIME_TOOLS_SOURCE" ] && [ ! -d backend/media/runtime-tools/java ]; then
              echo "Sembrando runtime tools desde $RUNTIME_TOOLS_SOURCE"
              mkdir -p backend/media
              cp -a "$RUNTIME_TOOLS_SOURCE" backend/media/runtime-tools || true
            fi

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env run --rm --no-deps \
              -e RUNTIME_TOOLS_STRICT_CHECK=false backend \
              python manage.py ensure_runtime_tools

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env run --rm --no-deps \
              -e RUNTIME_TOOLS_STRICT_CHECK=false backend \
              python manage.py migrate --noinput

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env run --rm --no-deps \
              -e RUNTIME_TOOLS_STRICT_CHECK=false backend \
              python manage.py refresh_rett_seed || true

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env run --rm --no-deps \
              -e DEFAULT_REGISTRATION_GROUP_SLUG=abierto backend \
              python manage.py ensure_registration_group

            # Server Calc: llave SSH hacia qta (worker) y grupo qta-operators.
            mkdir -p "$PROJECT_PATH/secrets"
            printf '%s\n' "$QTA_SSH_PRIVATE_KEY" | tr -d '\r' > "$PROJECT_PATH/secrets/qta_ssh_key"
            chmod 600 "$PROJECT_PATH/secrets/qta_ssh_key"
            chown "${CURRENT_UID}:${CURRENT_GID}" "$PROJECT_PATH/secrets/qta_ssh_key"
            if ! ssh-keygen -y -f "$PROJECT_PATH/secrets/qta_ssh_key" >/dev/null 2>&1; then
              echo "ERROR: QTA_SSH_PRIVATE_KEY no es una llave privada válida."
              exit 1
            fi

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env run --rm --no-deps \
              -e RUNTIME_TOOLS_STRICT_CHECK=false backend \
              python manage.py ensure_qta_operators

            if ! $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env up -d --wait; then
              echo "Deploy falló; recopilando diagnóstico..."
              $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env ps || true
              $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env logs --no-color --tail=200 \
                backend db redis frontend celery-worker celery-heavy-worker celery-beat || true
              exit 1
            fi

            docker image prune -a -f
            docker builder prune -f
            rm -rf "$STAGING_DIR"

            systemctl reload nginx || true

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env ps

      - name: Smoke check public site
        env:
          PUBLIC_URL: ${{ vars.LIBRES_BACKEND_PUBLIC_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            home_status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${PUBLIC_URL}/" || true)"
            catalog_status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${PUBLIC_URL}/api/public/catalog/" || true)"
            echo "Intento ${attempt}: home=${home_status} catalog=${catalog_status}"
            if [ "$home_status" = "200" ] && [ "$catalog_status" = "200" ]; then
              echo "Smoke OK en ${PUBLIC_URL}"
              exit 0
            fi
            sleep 15
          done
          echo "ERROR: el sitio no respondió 200 en home y catálogo público."
          exit 1
