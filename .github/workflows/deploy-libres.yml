# .github/workflows/deploy-libres.yml
#
# Despliegue de PRODUCCIÓN: https://apps.agalano.com, servido por el stack
# Docker Compose aislado (`docker-compose.libres.yml` en
# `/home/deploy/chemistry-apps-libres`) con el modo libre activo.
#
# Autónomo a propósito: NO reutiliza `deploy.yml`, asociado al stack antiguo
# (`apps.guzman-lopez.com` / `back-apps.guzman-lopez.com`), retirado el
# 2026-09-25. Construye el bundle con `git archive` del commit que se empuja
# y despliega en su propio directorio.
#
# Triggers: `main` publica producción; `refactor/local-first` sigue habilitada
# como rama de trabajo durante la migración.

name: Deploy production apps.agalano.com

on:
  push:
    branches:
      - main
      - refactor/local-first
    paths-ignore:
      - '**.md'
      - 'memos/**'
      - 'docs/**'
      - 'research/**'
      - '.github/instructions/**'
  workflow_dispatch: {}

# Un despliegue a la vez sobre el mismo stack; nunca se interrumpe a la mitad.
concurrency:
  group: apps-libres-deploy
  cancel-in-progress: false

env:
  LIBRES_COMPOSE_FILE: docker-compose.libres.yml
  LIBRES_ENV_FILE: .env.deploy
  LIBRES_BUNDLE_FILE: apps-libres-bundle.tar.gz
  LIBRES_STAGING_DIR: /tmp/apps-libres-deploy-${{ github.run_id }}-${{ github.run_attempt }}
  # Guarda de disco: el host tiene ~41 GB libres e imágenes de 10-17 GB.
  LIBRES_MIN_FREE_GB: "15"

jobs:
  deploy:
    name: Deploy open mode site
    runs-on: ubuntu-latest
    steps:
      - name: Validate required config (vars + secrets)
        env:
          _PROJECT_PATH: ${{ vars.LIBRES_VM_PROJECT_PATH }}
          _ALLOWED_HOSTS: ${{ vars.LIBRES_ALLOWED_HOSTS }}
          _BACKEND_PUBLIC_URL: ${{ vars.LIBRES_BACKEND_PUBLIC_URL }}
          _DB_NAME: ${{ vars.LIBRES_DB_NAME }}
          _DB_USER: ${{ vars.LIBRES_DB_USER }}
          _DB_PASSWORD: ${{ secrets.LIBRES_DB_PASSWORD }}
          _SECRET_KEY: ${{ secrets.LIBRES_SECRET_KEY }}
        run: |
          missing=()
          [ -z "$_PROJECT_PATH" ] && missing+=(vars.LIBRES_VM_PROJECT_PATH)
          [ -z "$_ALLOWED_HOSTS" ] && missing+=(vars.LIBRES_ALLOWED_HOSTS)
          [ -z "$_BACKEND_PUBLIC_URL" ] && missing+=(vars.LIBRES_BACKEND_PUBLIC_URL)
          [ -z "$_DB_NAME" ] && missing+=(vars.LIBRES_DB_NAME)
          [ -z "$_DB_USER" ] && missing+=(vars.LIBRES_DB_USER)
          [ -z "$_DB_PASSWORD" ] && missing+=(secrets.LIBRES_DB_PASSWORD)
          [ -z "$_SECRET_KEY" ] && missing+=(secrets.LIBRES_SECRET_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: faltan vars/secrets del sitio libre: ${missing[*]}"
            exit 1
          fi
          echo "Configuración del sitio libre completa."

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build .env file for deployment
        env:
          SECRET_KEY: ${{ secrets.LIBRES_SECRET_KEY }}
          DB_NAME: ${{ vars.LIBRES_DB_NAME }}
          DB_USER: ${{ vars.LIBRES_DB_USER }}
          DB_PASSWORD: ${{ secrets.LIBRES_DB_PASSWORD }}
          ALLOWED_HOSTS: ${{ vars.LIBRES_ALLOWED_HOSTS }}
          BACKEND_PUBLIC_URL: ${{ vars.LIBRES_BACKEND_PUBLIC_URL }}
          PUBLIC_DISPATCH_RATE: ${{ vars.LIBRES_PUBLIC_DISPATCH_RATE }}
          PUBLIC_READ_RATE: ${{ vars.LIBRES_PUBLIC_READ_RATE }}
          ANONYMOUS_JOB_TTL_HOURS: ${{ vars.LIBRES_ANONYMOUS_JOB_TTL_HOURS }}
          SHARED_CACHE_TTL_DAYS: ${{ vars.LIBRES_SHARED_CACHE_TTL_DAYS }}
          ANONYMOUS_MAX_CONCURRENT_JOBS: ${{ vars.LIBRES_ANONYMOUS_MAX_CONCURRENT_JOBS }}
          OPEN_MODE_ENABLED: ${{ vars.LIBRES_OPEN_MODE_ENABLED }}
          BACKEND_INTERNAL_PORT: ${{ vars.LIBRES_EXTERNAL_BACKEND_PORT }}
          FRONTEND_INTERNAL_PORT: ${{ vars.LIBRES_EXTERNAL_FRONTEND_PORT }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > "$LIBRES_ENV_FILE" <<EOF_ENV
          DEBUG=0
          SECRET_KEY=${SECRET_KEY}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          DB_HOST=db
          DB_PORT=5432
          POSTGRES_DB=${DB_NAME}
          POSTGRES_USER=${DB_USER}
          POSTGRES_PASSWORD=${DB_PASSWORD}
          DJANGO_ALLOWED_HOSTS=${ALLOWED_HOSTS}
          ALLOWED_HOSTS=${ALLOWED_HOSTS}
          NUM_PROXIES=1
          CORS_ALLOWED_ORIGINS=${BACKEND_PUBLIC_URL}
          CSRF_TRUSTED_ORIGINS=${BACKEND_PUBLIC_URL}
          BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL}
          BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT:-8090}
          FRONTEND_INTERNAL_PORT=${FRONTEND_INTERNAL_PORT:-4220}
          PUBLIC_DISPATCH_RATE=${PUBLIC_DISPATCH_RATE:-60/hour}
          PUBLIC_READ_RATE=${PUBLIC_READ_RATE:-120/hour}
          ANONYMOUS_JOB_TTL_HOURS=${ANONYMOUS_JOB_TTL_HOURS:-24}
          SHARED_CACHE_TTL_DAYS=${SHARED_CACHE_TTL_DAYS:-7}
          ANONYMOUS_MAX_CONCURRENT_JOBS=${ANONYMOUS_MAX_CONCURRENT_JOBS:-2}
          OPEN_MODE_ENABLED=${OPEN_MODE_ENABLED:-1}
          CELERY_HEAVY_PLUGINS=toxicity-properties
          CELERY_HEAVY_QUEUE=heavy
          DEFAULT_REGISTRATION_GROUP_SLUG=abierto
          IMAGE_TAG=${IMAGE_TAG}
          IMAGE_TAG_BACKEND=${IMAGE_TAG}
          IMAGE_TAG_FRONTEND=${IMAGE_TAG}
          IMAGE_REGISTRY=ghcr.io
          IMAGE_NAMESPACE=${{ github.repository_owner }}
          EOF_ENV
          echo "Archivo de entorno generado para el commit ${IMAGE_TAG}."

      - name: Build deployment bundle
        run: |
          git archive --format=tar.gz --output "$LIBRES_BUNDLE_FILE" "${GITHUB_SHA}"
          ls -lh "$LIBRES_BUNDLE_FILE"

      - name: Preflight SSH connectivity
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_PORT: ${{ vars.VM_PORT }}
        run: |
          for attempt in 1 2 3; do
            if timeout 10 bash -lc "cat < /dev/null > /dev/tcp/${VM_HOST}/${VM_PORT}" 2>/dev/null; then
              echo "Conectividad TCP OK contra ${VM_HOST}:${VM_PORT}"
              exit 0
            fi
            echo "Intento ${attempt}/3 sin conectividad a ${VM_HOST}:${VM_PORT}."
            sleep 5
          done
          echo "ERROR: no hay conectividad TCP hacia ${VM_HOST}:${VM_PORT}."
          exit 1

      - name: Prepare SSH private key
        id: ssh_key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_SSH_KEY_BASE64: ${{ secrets.VM_SSH_KEY_BASE64 }}
          VM_SSH_PASSPHRASE: ${{ secrets.VM_SSH_PASSPHRASE }}
        run: |
          set -e
          KEY_DIR="$GITHUB_WORKSPACE/.github/.tmp-ssh"
          KEY_FILE="$KEY_DIR/deploy_key"
          mkdir -p "$KEY_DIR"

          if [ -n "${VM_SSH_KEY_BASE64:-}" ]; then
            printf '%s' "$VM_SSH_KEY_BASE64" | base64 -d > "$KEY_FILE"
          else
            printf '%s\n' "$VM_SSH_KEY" | tr -d '\r' > "$KEY_FILE"
          fi

          chmod 600 "$KEY_FILE"

          if ! ssh-keygen -y -P "${VM_SSH_PASSPHRASE:-}" -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "ERROR: VM_SSH_KEY no es válida o requiere passphrase incorrecta."
            exit 1
          fi

          echo "key_path=$KEY_FILE" >> "$GITHUB_OUTPUT"
          {
            echo "private_key<<__DEPLOY_KEY__"
            cat "$KEY_FILE"
            echo "__DEPLOY_KEY__"
          } >> "$GITHUB_OUTPUT"

      - name: Upload bundle to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          port: ${{ vars.VM_PORT }}
          key: ${{ steps.ssh_key.outputs.private_key }}
          passphrase: ${{ secrets.VM_SSH_PASSPHRASE }}
          source: "${{ env.LIBRES_ENV_FILE }},${{ env.LIBRES_BUNDLE_FILE }}"
          target: ${{ env.LIBRES_STAGING_DIR }}
          overwrite: true
          timeout: 120s
          command_timeout: 20m

      - name: Deploy on remote host
        uses: appleboy/ssh-action@v1.2.2
        env:
          PROJECT_PATH: ${{ vars.LIBRES_VM_PROJECT_PATH }}
          COMPOSE_FILE: ${{ env.LIBRES_COMPOSE_FILE }}
          ENV_FILE: ${{ env.LIBRES_ENV_FILE }}
          BUNDLE_FILE: ${{ env.LIBRES_BUNDLE_FILE }}
          STAGING_DIR: ${{ env.LIBRES_STAGING_DIR }}
          MIN_FREE_GB: ${{ env.LIBRES_MIN_FREE_GB }}
          # Los runtime tools (JREs + JAR Ambit) ya existen en el stack
          # principal: se copian para no descargarlos de nuevo en cada volumen.
          RUNTIME_TOOLS_SOURCE: /home/deploy/chemistry-apps/backend/media/runtime-tools
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          port: ${{ vars.VM_PORT }}
          key: ${{ steps.ssh_key.outputs.private_key }}
          passphrase: ${{ secrets.VM_SSH_PASSPHRASE }}
          envs: PROJECT_PATH,COMPOSE_FILE,ENV_FILE,BUNDLE_FILE,STAGING_DIR,MIN_FREE_GB,RUNTIME_TOOLS_SOURCE
          command_timeout: 60m
          script: |
            set -e

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "ERROR: docker compose no está disponible en el host."
              exit 1
            fi

            mkdir -p "$PROJECT_PATH" "$STAGING_DIR"
            CURRENT_UID="$(id -u)"
            CURRENT_GID="$(id -g)"

            # Reparar propietarios de código fuente (excluye datos persistentes).
            docker run --rm -v "$PROJECT_PATH:/work" alpine \
              sh -c "find /work -maxdepth 1 -mindepth 1 ! -name docker-data -exec chown -R ${CURRENT_UID}:${CURRENT_GID} {} + 2>/dev/null; true"

            tar --no-same-owner -xzf "$STAGING_DIR/$BUNDLE_FILE" -C "$PROJECT_PATH"

            mkdir -p "$PROJECT_PATH/docker-data/postgres" "$PROJECT_PATH/docker-data/redis" "$PROJECT_PATH/backend/media"
            chmod u+rwX "$PROJECT_PATH/backend/media" 2>/dev/null || true
            chmod u+rwX "$PROJECT_PATH/docker-data/redis" 2>/dev/null || true

            cd "$PROJECT_PATH"

            if [ -f .env ] && cmp -s "$STAGING_DIR/$ENV_FILE" .env; then
              echo ".env sin cambios; se conserva."
            else
              install -m 600 "$STAGING_DIR/$ENV_FILE" .env
            fi

            export HOST_UID="$(id -u)"
            export HOST_GID="$(id -g)"

            # Liberar espacio antes del build: el host comparte disco con el
            # stack principal y las imágenes del backend pesan 10-17 GB.
            docker image prune -a -f
            docker builder prune -f

            FREE_GB="$(df -BG --output=avail / | tail -1 | tr -dc '0-9')"
            echo "Espacio libre antes del build: ${FREE_GB} GB (mínimo ${MIN_FREE_GB} GB)."
            if [ "${FREE_GB:-0}" -lt "$MIN_FREE_GB" ]; then
              echo "ERROR: espacio insuficiente para construir el stack del modo abierto."
              echo "Libera disco (docker image prune -a -f) o detén el stack principal."
              exit 1
            fi

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env build --no-cache --pull backend frontend

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env up -d --wait db redis

            # Los runtime tools científicos (JREs + JAR Ambit) son obligatorios
            # para que Django arranque: se copian del stack principal si existen
            # y, si falta algo, `ensure_runtime_tools` los descarga.
            if [ -d "$RUNTIME_TOOLS_SOURCE" ] && [ ! -d backend/media/runtime-tools/java ]; then
              echo "Sembrando runtime tools desde $RUNTIME_TOOLS_SOURCE"
              mkdir -p backend/media
              cp -a "$RUNTIME_TOOLS_SOURCE" backend/media/runtime-tools || true
            fi

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env run --rm --no-deps \
              -e RUNTIME_TOOLS_STRICT_CHECK=false backend \
              python manage.py ensure_runtime_tools

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env run --rm --no-deps \
              -e RUNTIME_TOOLS_STRICT_CHECK=false backend \
              python manage.py migrate --noinput

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env run --rm --no-deps \
              -e RUNTIME_TOOLS_STRICT_CHECK=false backend \
              python manage.py refresh_rett_seed || true

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env run --rm --no-deps \
              -e DEFAULT_REGISTRATION_GROUP_SLUG=abierto backend \
              python manage.py ensure_registration_group

            if ! $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env up -d --wait; then
              echo "Deploy falló; recopilando diagnóstico..."
              $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env ps || true
              $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env logs --no-color --tail=200 \
                backend db redis frontend celery-worker celery-heavy-worker celery-beat || true
              exit 1
            fi

            docker image prune -a -f
            docker builder prune -f
            rm -rf "$STAGING_DIR"

            systemctl reload nginx || true

            $COMPOSE_CMD -f "$COMPOSE_FILE" --env-file .env ps

      - name: Smoke check public site
        env:
          PUBLIC_URL: ${{ vars.LIBRES_BACKEND_PUBLIC_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            home_status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${PUBLIC_URL}/" || true)"
            catalog_status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${PUBLIC_URL}/api/public/catalog/" || true)"
            echo "Intento ${attempt}: home=${home_status} catalog=${catalog_status}"
            if [ "$home_status" = "200" ] && [ "$catalog_status" = "200" ]; then
              echo "Smoke OK en ${PUBLIC_URL}"
              exit 0
            fi
            sleep 15
          done
          echo "ERROR: el sitio no respondió 200 en home y catálogo público."
          exit 1
