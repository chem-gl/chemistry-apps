# pyproject.toml: Configuracion de herramientas de calidad para el backend Django.
# Incluye formato automatico con Black 
# se agrego poetry para manejo de dependncias

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "chemistry-apps-backend"
version = "0.1.0"
description = "Backend Django para aplicaciones cientificas de Chemistry Apps"
authors = ["Chem GL <cesar-gerardo@guzman-lopez.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
asgiref = "3.12.1"
backend = "0.2.4.1"
channels = "4.3.2"
channels-redis = "4.3.0"
daphne = "4.2.3"
celery = "5.6.3"
Django = "6.1.1"
django-cors-headers = "4.9.0"
djangorestframework = "3.18.1"
drf-spectacular = "0.30.0"
djangorestframework-simplejwt = "5.5.1"
kombu = "5.6.2"
matplotlib = "3.11.2"
numpy = "2.5.3"
pandas = "3.0.5"
rdkit = "2026.3.6"
redis = "8.1.0"
psycopg = "3.3.5"
psycopg-binary = "3.3.5"
psycopg2-binary = "2.9.13"

# Grupo opcional para apps científicas con dependencias pesadas (torch/cuda/gpu).
# Se omite en deploy host (migraciones) pero se instala en la imagen Docker.
google-auth = "^2.58.0"
requests = "^2.34.2"
[tool.poetry.group.scientific.dependencies]
admet_ai = "2.0.1"

[tool.poetry.group.dev.dependencies]
black = "26.5.1"
flake8 = "7.3.0"
coverage = "7.16.1"
pytest = "9.1.1"
pytest-cov = "7.1.0"
ipython = "8.12.3"
pipreqs = { version = "0.5.0", python = "<3.13" }
ruff = "0.15.8"  # 0.16+ expandió el set de reglas default (283 errores en código preexistente); fuera de scope de este update
beautifulsoup4 = "4.15.0"
mipy = "0.0.1"
rich = "15.0.0"

[tool.pytest.ini_options]
# Configuración de pytest. Django se inicializa vía conftest.py con os.environ.
addopts = "-v --tb=short"
# Recolectar también archivos tests.py (Django por convención usa este nombre)
python_files = "test_*.py tests.py"
filterwarnings = [
    # Advertencias de dependencias de terceros (torch/lightning) irrelevantes para el proyecto.
    # La advertencia de LeafSpec viene de torch con category=FutureWarning, no DeprecationWarning.
    "ignore:.*isinstance.*LeafSpec.*:FutureWarning",
    "ignore:.*predict_dataloader.*num_workers.*:UserWarning",
]

[tool.coverage.run]
# Mide cobertura del código fuente, excluyendo código no-testeable:
# migraciones autogeneradas, comandos de management, código de ejemplo y librerías externas.
source = ["."]
omit = [
    "*/migrations/*.py",
    "*/management/commands/*.py",
    "apps/core/declarative_api_usage_examples.py",
    "libs/**",
    "conftest.py",
    ".venv/**",
    "manage.py",
    "config/wsgi.py",
    "config/asgi.py",
    "config/startup_production.py",
    "config/celery.py",
    "config/settings.py",
    "asyncapi/**",
]

[tool.coverage.report]
# Umbrales mínimos de cobertura. El test fallará si la cobertura cae por debajo.
# Backend objetivo: 91% Configurable ajustando estos valores.
fail_under = 91

# No se cuentan líneas de imports/pass/docstrings puras como no cubiertas.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '\\.\\.\\.',
    "pass",
    "if __name__ == .__main__.:",
    "^import .*",
    "^from .* import .*",
    "def __str__",
    "def __repr__",
]

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
  |media
  |libs
  |openapi
  |__pycache__
  |\.pytest_cache
  |\.ruff_cache
)/
'''

[tool.pylsp]
[tool.pylsp.plugins.preload]
enabled = false
[tool.pylsp.plugins.pylint]
enabled = false
[tool.pylsp.plugins.mypy_ls]
enabled = false
[tool.pylsp.plugins.jedi_completion]
resolve_at_most = 5
